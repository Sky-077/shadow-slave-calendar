name: Shadow Slave Calendar

on:
  schedule:
    # Vérification toutes les 2 heures.
    - cron: "0 */2 * * *"

  # Permet également de lancer le workflow
  # manuellement depuis GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Mettre à jour le calendrier
        run: |
          python shadow_slave_tracker.py

      - name: Enregistrer les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Shadow_Slave.ics

          if git diff --cached --quiet; then
            echo "Aucune modification du calendrier."
          else
            git commit -m "Update Shadow Slave calendar"
            git push
          fi
